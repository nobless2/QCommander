name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v5

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ -f "QCommander.zip" ]; then
            gh release create "$TAG" QCommander.zip --title "$TAG" --notes "Release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes "Release $TAG"
          fi
